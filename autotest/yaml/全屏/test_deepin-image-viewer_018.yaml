name: "[046][smoke][acp1]全屏-快捷键退出全屏"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【F11】
  2. 使用快捷键【ESC】

  预期结果:
  1. 切换为全屏
  2. 切换为窗口
module: 全屏
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652203"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "按下F11进入全屏"
    action: keyboard_press
    keys: "F11"
    wait_after: 1000
  - name: "按下Escape退出全屏"
    action: keyboard_press
    keys: "Escape"
    wait_after: 1000
teardown:
  - action: session_stop
