name: "键鼠交互-快捷键F11全屏切换"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【F11】

  预期结果:
  1. 切换至全屏
module: 键鼠交互
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652667"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按下F11切换至全屏"
    action: keyboard_press
    keys: "F11"
    wait_after: 1000
teardown:
  - action: session_stop
