name: "[043][smoke][acp1]全屏-右键菜单退出全屏"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 在图片查看区域点击【鼠标右键】
  2. 点击选择右键菜单中的【退出全屏】选项

  预期结果:
  1. 唤起右键菜单
  2. 切换为窗口展示
module: 全屏
feature: ''
tags:
  - L2

vars:
  XLSX_ID: "1652199"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "右键菜单点击退出全屏"
    action: context_menu_comb
    items:
      - "退出全屏"
    x: 960
    y: 540
    wait_after: 1000
teardown:
  - action: session_stop
