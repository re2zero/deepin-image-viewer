name: "键鼠交互-快捷键Up放大图片"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【up】

  预期结果:
  1. 放大图片，最大可放大至2000%
module: 键鼠交互
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652653"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按下Up键放大图片"
    action: keyboard_press
    keys: "Up"
    wait_after: 500
  - name: "再次按下Up键放大图片"
    action: keyboard_press
    keys: "Up"
    wait_after: 500
teardown:
  - action: session_stop
