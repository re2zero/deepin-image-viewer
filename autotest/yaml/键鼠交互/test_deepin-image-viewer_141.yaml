name: "键鼠交互-快捷键F5播放幻灯片"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【F5】

  预期结果:
  1. 播放幻灯片
module: 键鼠交互
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652645"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按下F5播放幻灯片"
    action: keyboard_press
    keys: "F5"
    wait_after: 2000
  - name: "按Escape停止幻灯片"
    action: keyboard_press
    keys: "Escape"
    wait_after: 500
teardown:
  - action: session_stop
