name: "[259][core]键鼠切换-首张图时切换上一张"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 点击工具栏的【上一张】，直至切换至首张图片
  2. 移动鼠标至图片预览区域上
  3. 按住快捷键【Ctrl】，同时滚动鼠标滚轮

  预期结果:
  1. 切换至首张图片，工具栏的上一张按钮置灰
  2. 鼠标在图片预览区域上
  3. 看图不会向上切换图片，只可向下切换图片，不会循环切换图片
module: 工具栏
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652073"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "点击上一张按钮直至切换至首张"
    action: element_action
    selector:
      role: "push button"
      name: "上一张"
    wait_after: 1000
  - name: "验证首张图片时上一张按钮置灰"
    action: wait
    wait: 0.5
  - name: "将鼠标移动至图片预览区域"
    action: mouse_click
    selector:
      role: "image"
      name: "Image View"
  - name: "按住Ctrl键"
    action: keyboard_press
    keys: "Control_L"
  - name: "向前滚动鼠标滚轮尝试切换上一张"
    action: mouse_scroll
    direction: "up"
    delta: 1
    wait_after: 1000
  - name: "验证不会向上切换图片"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
