name: "[260][core]键鼠切换-撕裂图页面检查图片切换功能"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 移动光标至图片预览区域的图片上
  2. 按住快捷键【Ctrl】，同时滚动鼠标滚轮

  预期结果:
  1. 鼠标移动至图片上
  2. 看图跟随鼠标滚动切换图片
module: 工具栏
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652093"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "将鼠标移动至图片预览区域"
    action: mouse_click
    selector:
      role: "image"
      name: "Image View"
  - name: "按住Ctrl键"
    action: keyboard_press
    keys: "Control_L"
  - name: "向后滚动鼠标滚轮"
    action: mouse_scroll
    direction: "down"
    delta: 1
    wait_after: 1000
  - name: "验证看图跟随鼠标滚动切换图片"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
