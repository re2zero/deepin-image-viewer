name: "键鼠交互-快捷键Left切换上一张"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【left】

  预期结果:
  1. 切换至上一张图片
module: 键鼠交互
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652669"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按下Left键切换至上一张图片"
    action: keyboard_press
    keys: "Left"
    wait_after: 500
teardown:
  - action: session_stop
