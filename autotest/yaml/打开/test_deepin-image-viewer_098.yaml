name: "键鼠交互-快捷键Ctrl+O打开图片窗口"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【Ctrl+O】

  预期结果:
  1. 打开文管选择图片窗口
module: 键鼠交互
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652647"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按下Ctrl+O打开文管选择图片窗口"
    action: keyboard_press
    keys: "ctrl+o"
    wait_after: 1000
teardown:
  - action: session_stop
