# UNSUPPORTED: 需要终端命令执行(ll-cli upgrade)，无法通过 AT-SPI 自动化
name: "玲珑-更新玲珑应用"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:
  1. 已经安装过旧版本的玲珑应用

  测试步骤:
  1. 在终端执行命令：ll-cli upgrade deepin-image-viewer
  2. 在终端执行命令：ll-cli run deepin-image-viewer

  预期结果:
  1. 【看图】升级成功，默认升级到最新版本，可以使用命令查看信息：ll-cli info deepin-image-viewer
  2. 【看图】打开运行成功，版本为升级后的版本
module: 看图
feature: 'SR-01196：【玲珑】【看图】构建玲珑包(#35845)'
tags:
  - L2

vars:
  XLSX_ID: "1705097"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "verify app starts"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
