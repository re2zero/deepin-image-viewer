# UNSUPPORTED: 需要终端命令执行(ll-cli install)，无法通过 AT-SPI 自动化
name: "玲珑-安装玲珑应用"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 在终端执行命令：ll-cli install deepin-image-viewer

  预期结果:
  1. 等待一段时间后，【看图】安装完成(如果有多个版本，默认安装最高版本)，可以使用命令查看信息：ll-cli info org.deepin.calculator
module: 看图
feature: 'SR-01196：【玲珑】【看图】构建玲珑包(#35845)'
tags:
  - L2

vars:
  XLSX_ID: "1705087"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "verify app starts"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
