# UNSUPPORTED: 相册右键菜单新建菜单需要启动相册应用并从相册中打开图片，无法直接模拟
name: "公共能力-相册右键菜单新建菜单"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 相册调用看图打开任意图片
  2. 在图片查看区域任意位置点击鼠标右键
  3. 点击【添加到相册】
  4. 点击【新建菜单】

  预期结果:
  1.
  2. 唤起右键菜单
  3. 打开添加到相册的二级菜单
  4. 弹出新建相册对话框
module: 公共能力
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652397"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "SKIP-相册右键菜单新建相册操作"
    action: noop
    wait_after: 1000
teardown:
  - action: session_stop
