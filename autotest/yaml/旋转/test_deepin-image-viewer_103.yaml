name: "用户场景-视图切换、放大、旋转、翻转"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 点击左右切换按钮，切换图片
  2. 滚动鼠标滚轮，放大和缩小图片
  3. 点击旋转按钮，对图片进行旋转
  4. 点击翻转按钮，对图片进行翻转
  5. 点击1：1视图按钮
  6. 点击适应窗口按钮

  预期结果:
  1. 图片可以正常左右切换
  2. 图片被正常放大和缩小
  3. 图片被正常旋转
  4. 图片被正常翻转
  5. 图片进行1：1视图展示
  6. 图片进行自适应窗口展示
module: 用户场景
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652779"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "验证图片正常显示"
    action: noop
    assert:
      - type: screenshot_changed
        negate: false
    wait_after: 1000
  - name: "切换至下一张图片"
    action: keyboard_press
    keys: "Right"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "切换至上一张图片"
    action: keyboard_press
    keys: "Left"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "放大图片"
    action: mouse_scroll
    direction: "up"
    steps: 3
    wait_after: 500
    assert:
      - type: screenshot_changed
        negate: false
  - name: "缩小图片"
    action: mouse_scroll
    direction: "down"
    steps: 3
    wait_after: 500
    assert:
      - type: screenshot_changed
        negate: false
  - name: "旋转图片"
    action: keyboard_press
    keys: "Ctrl+R"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "翻转图片"
    action: keyboard_press
    keys: "Ctrl+Shift+H"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "点击1:1视图按钮"
    action: keyboard_press
    keys: "Ctrl+1"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "点击适应窗口按钮"
    action: keyboard_press
    keys: "Ctrl+0"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
teardown:
  - action: session_stop
