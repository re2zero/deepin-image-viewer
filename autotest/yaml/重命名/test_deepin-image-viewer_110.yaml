name: "重命名-修改图片名称较长时检查省略号展示"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 使用快捷键【F2】
  2. 点击名称编辑框右侧的【X】清除按钮
  3. 输入图片名称为【任意名称】至少包含40个字符长度
  4. 点击【确定】按钮
  5. 再次使用快捷键【F2】

  预期结果:
  1. 唤起重命名窗口
  2. 清空当前名称编辑框
  3. 输入名称成功
  4. 文件名修改成功
  5. 名称展示形式为：XXX···XXXXX
module: 重命名
feature: ''
tags:
  - L3

vars:
  XLSX_ID: "1652319"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "使用F2唤起重命名窗口"
    action: keyboard_press
    keys: "F2"
    wait_after: 1500
  - name: "清除当前名称"
    action: keyboard_press
    keys: "Control+A"
    wait_after: 200
  - name: "输入超长名称（40+字符）"
    action: keyboard_type
    value: "abcdefghijklmnopqrstuvwxyz1234567890abcde"
    wait_after: 500
  - name: "点击确认"
    action: keyboard_press
    keys: "Return"
    wait_after: 1000
  - name: "再次F2查看省略号展示"
    action: keyboard_press
    keys: "F2"
    wait_after: 1500
teardown:
  - action: session_stop
