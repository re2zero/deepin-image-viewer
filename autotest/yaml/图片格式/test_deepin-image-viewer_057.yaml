name: "[090]tif多页图-切换页后检查缩略"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 点击工具栏的【下一页】按钮

  预期结果:
  1. 切换至多页图的下一页图片，缩略图不变
module: 工具栏
feature: ''
tags:
  - L2

vars:
  XLSX_ID: "1652069"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "点击工具栏下一页按钮"
    action: element_action
    selector:
      role: "push button"
      name: "下一张"
    wait_after: 1000
  - name: "验证切换至多页图下一页图片缩略图不变"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
