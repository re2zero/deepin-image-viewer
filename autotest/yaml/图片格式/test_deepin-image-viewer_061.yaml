name: "图片格式-支持设置壁纸格式图片检查"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:
  有包含jpeg、png、bmp格式图片的文件夹

  测试步骤:
  1. 点击查看包含jpeg、png、bmp格式图片的文件夹
  2. 使用快捷键【Ctrl+F9】，检查桌面壁纸，然后切换至下一张，重复此步骤

  预期结果:
  1. 文件夹被打开，每张图片都可以正常查看
  2. 每一张都可以成功设置为桌面壁纸
module: 图片格式
feature: ''
tags:
  - L2

vars:
  XLSX_ID: "1652741"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "验证图片正常显示"
    action: noop
    assert:
      - type: screenshot_changed
        negate: false
    wait_after: 1000
  - name: "设置当前图片为桌面壁纸"
    action: keyboard_press
    keys: "Ctrl+F9"
    wait_after: 2000
  - name: "切换至下一张图片"
    action: keyboard_press
    keys: "Right"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "设置下一张图片为桌面壁纸"
    action: keyboard_press
    keys: "Ctrl+F9"
    wait_after: 2000
  - name: "切换至下一张图片"
    action: keyboard_press
    keys: "Right"
    wait_after: 800
    assert:
      - type: screenshot_changed
        negate: false
  - name: "设置下一张图片为桌面壁纸"
    action: keyboard_press
    keys: "Ctrl+F9"
    wait_after: 2000
teardown:
  - action: session_stop
