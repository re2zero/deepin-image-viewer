name: "[319]tif多页图-工具栏切换上一张图片"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 点击工具栏的【上一张】按钮

  预期结果:
  1. 切换至上一张图片，缩略图不变
module: 工具栏
feature: ''
tags:
  - L1

vars:
  XLSX_ID: "1652071"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "点击工具栏上一张按钮"
    action: element_action
    selector:
      role: "push button"
      name: "上一张"
    wait_after: 1000
  - name: "验证切换至上一张图片缩略图不变"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
