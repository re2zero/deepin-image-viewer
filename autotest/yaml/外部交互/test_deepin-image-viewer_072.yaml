# UNSUPPORTED: 需要压缩文件交互，无法通过 AT-SPI 自动化
name: "外部交互-与压缩文件交互"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 选择压缩包中的任意图片使用看图打开
  2. 任意操作图片（旋转、删除、重命名等）
  3. 点击【确认】

  预期结果:
  1. 可以正常打开选择的图片（单张或多张），不会打开压缩包中未选中的图片
  2. 若有读写权限则可以进行（旋转、删除、重命名等）操作，且会提示是否更新到压缩包中
  3. 图片更新压缩包中的状态
module: 其他应用
feature: ''
tags:
  - L4

vars:
  XLSX_ID: "1652765"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "verify app starts"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
