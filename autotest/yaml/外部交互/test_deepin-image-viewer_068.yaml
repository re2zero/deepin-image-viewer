# UNSUPPORTED: 需要截图工具和OCR识别交互，无法通过 AT-SPI 自动化
name: "用户场景-卸载截图后看图OCR识别成功"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 打开编辑器, 输入“欢迎使用统信UOS“
  2. 截取编辑器窗口并保存截图到桌面
  3. 卸载截图
  4. 双击打开保存的图片
  5. 点击OCR识别按钮

  预期结果:
  1. 编辑器正常打开, 主窗口显示“欢迎使用统信UOS“
  2. 桌面上出现截取的图片
  3. 卸载成功
  4. 截取的图片在看图中正常显示
  5. 识别到“欢迎使用统信UOS“
module: 用户场景
feature: ''
tags:
  - L2

vars:
  XLSX_ID: "1652777"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png"
    wait: 1.0
steps:
  - name: "verify app starts"
    action: wait
    wait: 1.0
teardown:
  - action: session_stop
