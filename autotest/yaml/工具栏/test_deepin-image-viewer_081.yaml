name: "工具栏-键鼠切换-连续切换图片过程中松开ctrl键"
app: deepin-image-viewer
screenshot: true
description: |
  前置条件:

  测试步骤:
  1. 在图片预览区域按住快捷键【Ctrl】，同时不停的来回快速滚动鼠标滚轮
  2. 在滚动过程中，立马松开快捷键【Ctrl】

  预期结果:
  1. 看图始终响应正常，始终可以正常切换图片
  2. 看图在松开ctrl的瞬间，立马停止切换图片，只会响应鼠标滚动的缩放指令
module: 工具栏
feature: ''
tags:
  - L2

vars:
  XLSX_ID: "1652049"
setup:
  - action: session_start
    command: "deepin-image-viewer ${TEST_FILES_DIR}/1.png ${TEST_FILES_DIR}/2.png ${TEST_FILES_DIR}/3.png"
    wait: 1.0
steps:
  - name: "按住Ctrl键"
    action: keyboard_press
    keys: "Ctrl_L"
    hold: true
  - name: "连续快速来回滚动鼠标滚轮"
    action: mouse_scroll
    direction: "up"
    delta: 3
    repeat: 5
    wait_after: 200
  - name: "反向滚动"
    action: mouse_scroll
    direction: "down"
    delta: 3
    repeat: 5
    wait_after: 200
  - name: "松开Ctrl键"
    action: keyboard_press
    keys: "Ctrl_L"
    release: true
    wait_after: 500
  - name: "验证松开Ctrl后只响应缩放"
    action: mouse_scroll
    direction: "up"
    delta: 1
    wait_after: 1000
  - name: "noop-检查看图响应正常"
    action: noop
teardown:
  - action: session_stop
